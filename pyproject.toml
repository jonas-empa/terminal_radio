[project]
name = "terminal-radio"
version = "0.2.0"
description = "Generic terminal internet radio player built with Textual and VLC"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.0",
]

[project.scripts]
terminal-radio = "terminal_radio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_radio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
